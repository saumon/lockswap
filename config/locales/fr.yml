# 025 research.md R8: rails-i18n ships French date/time/number formats that
# would silently reformat this app's `l(record.created_at, format: :long)`
# call sites the moment the site language switched to French. FR-012 (and the
# Clarifications session, 2026-09-21) requires dates and numbers to keep one
# fixed format regardless of language, so this app's own fr.yml — which loads
# after any gem's locale file for the same key — pins these three sections back
# to the exact values ActiveSupport's bundled en.yml uses, rather than the
# French conventions rails-i18n would otherwise contribute.
fr:
  # 025 T021: model/attribute names no gem can know, since they are unique to
  # this application. rails-i18n and devise-i18n both ship generic
  # activerecord.attributes coverage (created_at, updated_at, and Devise's own
  # User attributes), but "floor", "domain" and "language" are LockSwap's own
  # columns — there is nothing in en.yml to pair these with, because English
  # needs no override: Rails' plain humanization of the column name already
  # produces "Floor"/"Domain"/"Language" correctly on its own.
  activerecord:
    models:
      allowed_email_domain: "domaine e-mail autorisé"
      locker_wish: "recherche de casier"
      site_language_setting: "réglage de langue du site"
      site_floor_list: "liste des étages"
      locker_number_format: "format de numéro de casier"
    attributes:
      user:
        floor: "Étage"
        locker_number: "Numéro de casier"
      allowed_email_domain:
        domain: "Domaine"
      locker_wish:
        floor: "Étage"
      site_language_setting:
        language: "Langue"
      site_floor_list:
        floors_text: "Étages"
      locker_number_format:
        pattern: "Expression"
        description: "Description"

  date:
    formats:
      default: "%Y-%m-%d"
      short: "%b %d"
      long: "%B %d, %Y"
    # %B/%A/%b/%a in the formats above pull from these arrays, not from the
    # format string alone — pinned for the same FR-012 reason as the formats.
    day_names: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    abbr_day_names: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
    month_names: [~, January, February, March, April, May, June, July, August, September, October, November, December]
    abbr_month_names: [~, Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
  time:
    formats:
      default: "%a, %d %b %Y %H:%M:%S %z"
      short: "%d %b %H:%M"
      long: "%B %d, %Y %H:%M"
    am: "am"
    pm: "pm"
  number:
    format:
      separator: "."
      delimiter: ","
      precision: 3
      round_mode: default
      significant: false
      strip_insignificant_zeros: false

  errors:
    messages:
      floor_not_offered: "ne fait pas partie des étages du site"
      locker_number_format_mismatch: "doit respecter le format requis : %{expected}"

