en:
  # 032: a single deliberate exception to 025/FR-012's "dates keep one fixed
  # format regardless of language" rule, on the user's own explicit request —
  # this one format (only ever used for the homepage's received-proposal
  # timestamp) is the same literal string in both languages, "à" included,
  # rather than varying by site language — consistent with FR-012's own
  # reasoning (pick one rendering, on purpose, and hold it), just applied to a
  # second, different fixed string instead of extending the first one's use.
  time:
    formats:
      numeric_at: "%d/%m/%Y à %H:%M"
  # 030: shared by User and LockerWish through SiteFloorValidator, so one entry
  # per language rather than one per model.
  errors:
    messages:
      floor_not_offered: "is not one of the site's floors"
      locker_number_format_mismatch: "must match the required format: %{expected}"
      locker_number_unknown: "is not a recognized locker — ask an administrator to add it to the locker map"
  # 030: English needs no override for most columns — Rails humanizes them
  # correctly on its own — but floors_text is a virtual attribute whose
  # humanized name ("Floors text") is not what the form calls it.
  #
  # 031: zone/name and locker_map_entry/locker_number ARE plain humanizable
  # columns (English needs no override there either) — they are listed here
  # only because the Locker Map's compact inline controls (finding: too
  # sparse) read their aria-label from t("activerecord.attributes...")
  # directly rather than through f.label's own automatic humanization, and a
  # direct t() call has no such fallback in any language.
  activerecord:
    attributes:
      site_floor_list:
        floors_text: "Floors"
      zone:
        name: "Name"
        floor: "Floor"
      locker_map_entry:
        locker_number: "Locker number"
