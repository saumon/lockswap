# 013: every account carries an explicit created_at, because the administrator
# directory lists accounts in registration order (FR-010) and Rails otherwise
# stamps every fixture row at load time with the same value — which would leave
# the order of that list unspecified, and an ordering assertion passing or
# failing on whatever SQLite happened to return that run.
#
# The dates are spread a day apart in the order the fixtures were introduced by
# the features that needed them, so the list reads the way a real one would.

# Shared account used across the signup, login, and lockout tests.
# The plaintext password is "password123" (see ActiveSupport::TestCase::VALID_PASSWORD).
alice:
  email: alice@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  created_at: 2026-02-02 09:00:00

# Locker-profile fixtures (002): bob has both values, carol has a floor but no
# locker assigned. alice deliberately has neither — she is the "not yet asked" case.
bob:
  email: bob@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "3"
  locker_number: "B12"
  created_at: 2026-02-03 09:00:00

carol:
  email: carol@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "2"
  created_at: 2026-02-04 09:00:00

# 003: has both a floor and a locker on file, and deliberately no wish — the
# "already has a locker, wants a different floor" case, without a test having to
# delete a fixture wish before it can start.
dave:
  email: dave@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "4"
  locker_number: "D07"
  created_at: 2026-02-05 09:00:00

# 010: has answered the locker question — floor on file — and said they have no
# locker, with no wish declared. That is the "I want a locker! 🙏" state on the
# homepage, and no earlier fixture covers it: carol is floor-only too, but she
# already carries carol_wish, and deleting a fixture wish inside a test is what
# the note in locker_wishes.yml exists to avoid.
erin:
  email: erin@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "5"
  created_at: 2026-02-06 09:00:00

# 013 FR-001: the site's administrator — the account that registered first, which
# is why its created_at is the earliest here. The flag is set explicitly because
# fixtures are inserted straight into the database and never run the before_create
# callback that assigns it in production (research.md R6); left off, no test would
# ever see an administrator at all.
#
# Deliberately a fixture of its own rather than a flag on alice: she is signed in
# by seventy-odd assertions across seventeen files, and none of them is about the
# administrator menu.
frank:
  email: frank@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  admin: true
  created_at: 2026-02-01 09:00:00
