# 013: every account carries an explicit created_at, because the administrator
# directory lists accounts in registration order (FR-010) and Rails otherwise
# stamps every fixture row at load time with the same value — which would leave
# the order of that list unspecified, and an ordering assertion passing or
# failing on whatever SQLite happened to return that run.
#
# The dates are spread a day apart in the order the fixtures were introduced by
# the features that needed them, so the list reads the way a real one would.

# Shared account used across the signup, login, and lockout tests.
# The plaintext password is "password123" (see ActiveSupport::TestCase::VALID_PASSWORD).
alice:
  email: alice@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  created_at: 2026-02-02 09:00:00

# Locker-profile fixtures (002): bob has both values, carol has a floor but no
# locker assigned. alice deliberately has neither — she is the "not yet asked" case.
bob:
  email: bob@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "3"
  locker_number: "B12"
  created_at: 2026-02-03 09:00:00

carol:
  email: carol@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "2"
  created_at: 2026-02-04 09:00:00

# 003: has both a floor and a locker on file, and deliberately no wish — the
# "already has a locker, wants a different floor" case, without a test having to
# delete a fixture wish before it can start.
dave:
  email: dave@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "4"
  locker_number: "D07"
  created_at: 2026-02-05 09:00:00

# 010: has answered the locker question — floor on file — and said they have no
# locker, with no wish declared. That is the "I want a locker! 🙏" state on the
# homepage, and no earlier fixture covers it: carol is floor-only too, but she
# already carries carol_wish, and deleting a fixture wish inside a test is what
# the note in locker_wishes.yml exists to avoid.
erin:
  email: erin@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "5"
  created_at: 2026-02-06 09:00:00

# 013 FR-001: the site's administrator — the account that registered first, which
# is why its created_at is the earliest here. The flag is set explicitly because
# fixtures are inserted straight into the database and never run the before_create
# callback that assigns it in production (research.md R6); left off, no test would
# ever see an administrator at all.
#
# Deliberately a fixture of its own rather than a flag on alice: she is signed in
# by seventy-odd assertions across seventeen files, and none of them is about the
# administrator menu.
frank:
  email: frank@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  admin: true
  created_at: 2026-02-01 09:00:00

# 015 FR-017: an administrator who was granted the rights rather than claiming them
# at signup — the case 013 could not represent, because its index allowed only one
# administrator to exist at all.
#
# All three facts are set literally for the reason recorded above frank: fixtures are
# inserted straight into the database and run no callbacks, so nothing here derives
# them. admin_granted_at in particular is load-bearing: it is what puts this row
# outside index_users_on_bootstrap_admin. Leave it off and this row collides with
# frank, and every test in the suite fails at fixture load rather than one.
grace:
  email: grace@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  admin: true
  admin_granted_at: 2026-02-10 09:00:00
  admin_granted_by: frank
  created_at: 2026-02-07 09:00:00

# 017: the two accounts the floor filters are asserted against.
#
# judy's floor is "10" for one reason: against bob's "3" and carol's "2" it is the
# pair that sorts one way as text and the other way as a number, which is the whole
# of FR-007. No existing fixture could show that — every saved floor was a single
# digit.
judy:
  email: judy@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "10"
  locker_number: "J-10"
  created_at: 2026-02-08 09:00:00

# 017 FR-012: declares a wish but has never saved a floor of their own, so they are
# listed whenever the "Their floor" filter is on "All floors" and excluded whenever
# it names one. alice is the only other account with no floor, and she is
# deliberately wishless — see the note in locker_wishes.yml.
karl:
  email: karl@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  created_at: 2026-02-09 09:00:00

# 018: two accounts whose floor and wish reciprocate exactly with bob's (floor "3",
# wish "7") — henry and iris are both floor "7", wish "3", so a viewer signed in as
# bob sees an "It's a match!" tag on both of their rows at once. Two rather than
# one so a test can show more than one row tagged simultaneously (FR-007). `erin`
# was considered first and rejected: she already exists above with floor "5" and no
# wish, and is asserted against by 010's homepage test — reusing her would either
# collide at fixture load or silently break that test.
henry:
  email: henry@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "7"
  created_at: 2026-02-10 09:00:00

iris:
  email: iris@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "7"
  created_at: 2026-02-11 09:00:00

# 020: exists for the admin Users screen's filters. The literal underscore in the
# email is what the fixture email_containing's escaping test needs (research.md
# R4) — without it, nothing on file distinguishes "_" being escaped from "_"
# acting as a single-character SQL wildcard, since a wildcard would still
# (accidentally) match every other email here. floor "6" and locker "Q99" are
# both new values, so saved_floors and the current-locker filter each have
# something to find that no other fixture already provides.
#
# Deliberately no locker wish (see the note in locker_wishes.yml): every
# existing wish fixture is a member of feature 017's exact expected sets, and
# 020's own Wish-column coverage is already provided by bob/dave.
quinn:
  email: quinn_search@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "6"
  locker_number: "Q99"
  created_at: 2026-02-12 09:00:00
