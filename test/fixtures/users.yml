# Shared account used across the signup, login, and lockout tests.
# The plaintext password is "password123" (see ActiveSupport::TestCase::VALID_PASSWORD).
alice:
  email: alice@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0

# Locker-profile fixtures (002): bob has both values, carol has a floor but no
# locker assigned. alice deliberately has neither — she is the "not yet asked" case.
bob:
  email: bob@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "3"
  locker_number: "B12"

carol:
  email: carol@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "2"

# 003: has both a floor and a locker on file, and deliberately no wish — the
# "already has a locker, wants a different floor" case, without a test having to
# delete a fixture wish before it can start.
dave:
  email: dave@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "4"
  locker_number: "D07"

# 010: has answered the locker question — floor on file — and said they have no
# locker, with no wish declared. That is the "I want a locker! 🙏" state on the
# homepage, and no earlier fixture covers it: carol is floor-only too, but she
# already carries carol_wish, and deleting a fixture wish inside a test is what
# the note in locker_wishes.yml exists to avoid.
erin:
  email: erin@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  failed_attempts: 0
  floor: "5"
